id = "herdr.collie"
name = "Collie"
version = "0.23.0"
min_herdr_version = "0.7.0"
description = "Mobile web UI to monitor and reply to your agent herd, served over Tailscale"
platforms = ["linux", "macos", "windows"]

# This plugin is a thin launcher. The actual bridge runs under the native user supervisor so it
# outlives Herdr restarts (see ARCHITECTURE.md §3). The build creates one platform-native action
# launcher at build/collie-action.exe.

# Build the web UI at install time. Herdr runs [[build]] steps ONLY on `herdr plugin install`
# (GitHub) — NOT on `herdr plugin link` (local dev), which must run this build explicitly once.
# Delegating to the platform control script keeps a single build
# definition (version gate → cd web && bun install && bun run build) shared with the `update` action.
# Still needs Bun on PATH — building the frontend is the one unavoidable Bun step.
[[build]]
command = ["bash", "scripts/collie-ctl.sh", "build"]
platforms = ["linux", "macos"]

[[build]]
command = ["powershell.exe", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "scripts/collie-ctl.ps1", "build"]
platforms = ["windows"]

[[actions]]
id = "start"
title = "Start web bridge"
contexts = ["workspace"]
command = ["build/collie-action.exe", "start"]

[[actions]]
id = "stop"
title = "Stop web bridge"
contexts = ["workspace"]
command = ["build/collie-action.exe", "stop"]

[[actions]]
id = "restart"
title = "Restart web bridge"
contexts = ["workspace"]
command = ["build/collie-action.exe", "restart"]

# Full teardown: stops + disables the service, removes the systemd --user unit, and resets
# tailscale serve. Leaves the .env and the checkout (so `start` can bring it right back). See
# scripts/collie-ctl.sh → cmd_uninstall.
[[actions]]
id = "uninstall"
title = "Uninstall web bridge (remove service)"
contexts = ["workspace"]
command = ["build/collie-action.exe", "uninstall"]

# Link-mode plugins ARE their on-disk git checkout (Herdr has no native `plugin update`), so this
# action pulls + rebuilds + restarts in one step. See scripts/collie-ctl.sh → cmd_update.
[[actions]]
id = "update"
title = "Update plugin"
contexts = ["workspace"]
command = ["build/collie-action.exe", "update"]

[[actions]]
id = "url"
title = "Show bridge URL"
contexts = ["workspace"]
command = ["build/collie-action.exe", "url"]

[[actions]]
id = "status"
title = "Bridge status"
contexts = ["workspace"]
command = ["build/collie-action.exe", "status"]

[[actions]]
id = "version"
title = "Show version"
contexts = ["workspace"]
command = ["build/collie-action.exe", "version"]
