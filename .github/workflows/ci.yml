name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR supersedes the old run — don't burn a runner on the stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      # The MANDATORY invariant: the three version files + the newest CHANGELOG heading must agree.
      - name: Version consistency
        if: runner.os != 'Windows'
        run: bash scripts/check-version.sh
      - name: Version consistency (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: scripts/check-version.ps1

      - name: Install (root)
        run: bun install --frozen-lockfile
      - name: Typecheck (root)
        run: bun run typecheck
      - name: Test (bridge)
        run: bun test ./bridge
      - name: Test launcher lifecycle
        run: bun run test:ctl

      - name: Install (web)
        run: cd web && bun install --frozen-lockfile
      - name: Typecheck (web)
        run: cd web && bun run typecheck
      - name: Test (web)
        run: cd web && bun run test
