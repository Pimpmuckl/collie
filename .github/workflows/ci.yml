name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR supersedes the old run — don't burn a runner on the stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + tests
    strategy:
      fail-fast: false
      matrix:
        # Standard hosted runners are free for this public fork. Do not use billed larger runners.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      # The MANDATORY invariant: the three version files + the newest CHANGELOG heading must agree.
      - name: Version consistency
        run: bun run scripts/check-version.ts

      - name: Install (root)
        run: bun install --frozen-lockfile
      - name: Typecheck (root)
        run: bun run typecheck
      - name: Test (bridge)
        run: bun test ./bridge
      - name: Test launcher lifecycle
        run: bun run test:ctl

      - name: Install (web)
        run: cd web && bun install --frozen-lockfile
      - name: Typecheck (web)
        run: cd web && bun run typecheck
      - name: Test (web)
        run: cd web && bun run test
